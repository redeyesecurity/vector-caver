[package]
name = "vrl-caver-stdlib"
description = "VRL stdlib extensions: OCSF normalization, ATT&CK/CVE enrichment, security parsers"
# Explicit (not workspace-inherited): this crate is also a path dependency of the
# root vector workspace (the `caver` feature on vector-vrl-functions), and cargo
# resolves inheritance against root there, which has no workspace.package keys.
# Keep in lockstep with caver/Cargo.toml workspace.package.
version = "0.9.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "vrl_caver_stdlib"

[dependencies]
serde_json = "1"
vrl = { git = "https://github.com/vectordotdev/vrl.git", branch = "main", default-features = false, features = ["compiler", "value", "stdlib-base"] }

[dev-dependencies]
