[package]
name = "vrl-caver-stdlib"
description = "VRL stdlib extensions: OCSF normalization, ATT&CK/CVE enrichment, security parsers"
# Explicit (not workspace-inherited): this crate is also a path dependency of
# the root vector workspace (via vector-vrl-caver-stdlib, caver-collector#904),
# and cargo resolves inheritance against root there — same pattern as
# caver-sink-parquet. Keep version in lockstep with caver/Cargo.toml
# workspace.package.
version = "0.15.1"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "vrl_caver_stdlib"

[dependencies]
serde_json = "1"

[dev-dependencies]
