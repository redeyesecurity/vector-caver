name: caver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fork-integrity:
    name: fork integrity
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
      - name: FORK.md exists
        run: test -f FORK.md

  caver-crates:
    name: caver crates (fmt / clippy / test)
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no caver workspace
        id: check
        run: |
          if [ ! -f caver/Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.skip != 'true'
        with:
          workspaces: caver -> target
      - name: fmt
        if: steps.check.outputs.skip != 'true'
        run: cargo fmt --manifest-path caver/Cargo.toml --all -- --check
      - name: clippy
        if: steps.check.outputs.skip != 'true'
        working-directory: caver
        run: cargo clippy --workspace -- -D warnings
      - name: test
        if: steps.check.outputs.skip != 'true'
        working-directory: caver
        run: cargo test --workspace

  # Proves the caver crates stay loadable as real Vector components
  # (caver-collector#894): builds the root vector binary with only the
  # caver_parquet sink enabled and asserts component registration.
  vector-component:
    name: vector component registration
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 so the path filter below can diff against the parent.
          fetch-depth: 2
      - name: Skip if sink not wired
        id: check
        run: |
          if ! grep -q 'sinks-caver_parquet' Cargo.toml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if nothing build-relevant changed
        id: paths
        if: steps.check.outputs.skip != 'true'
        # The full vector build is the expensive job on this box; docs- or
        # workflow-text-only changes don't need it (caver-collector#898
        # item 7). Safe default: an empty or failed diff (merge edge cases,
        # force pushes) runs the build.
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) || changed=""
          if [ -n "$changed" ] && ! echo "$changed" | grep -qE '^(src/|lib/|caver/|proto/|build\.rs|Cargo\.(toml|lock)|\.github/workflows/caver-ci\.yml)'; then
            echo "No build-relevant paths changed; skipping the vector build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        with:
          key: vector-component
      - name: Install protoc (pinned)
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        # Pinned release zip instead of `brew install protobuf` so a brew
        # formula bump can't change codegen under us, and the runner doesn't
        # need brew write access (caver-collector#898 item 7). A protoc
        # already on the box (any source) short-circuits.
        run: |
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-osx-x86_64.zip"
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -oq "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - name: Build minimal vector with caver_parquet
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        # --locked: a stale committed Cargo.lock must fail here, not get
        # silently rewritten on the runner.
        run: cargo build --locked --no-default-features --features "sinks-caver_parquet,sinks-console,sources-demo_logs,transforms-remap"
      - name: caver_parquet registered in `vector list`
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        run: ./target/debug/vector list | grep -w caver_parquet
      - name: Config naming caver_parquet validates
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        # Full validate (no --no-environment) so SinkConfig::build actually
        # runs: env-var + sensor_id + endpoint checks are exercised. build()
        # does no I/O, and the real healthcheck (signed HEAD on the bucket,
        # caver-collector#898) is disabled because the endpoint here is
        # intentionally unreachable. RUNNER_TEMP keeps the 9 runners sharing
        # this box out of each other's way.
        run: |
          mkdir -p "$RUNNER_TEMP/caver-ci-data"
          cat > "$RUNNER_TEMP/caver-component-ci.toml" <<EOF
          data_dir = "$RUNNER_TEMP/caver-ci-data"

          [sources.demo]
          type = "demo_logs"
          format = "syslog"

          # Caver VRL functions resolve from remap (caver-collector#904):
          # validate compiles this source, so a binary missing the OCSF VRL
          # framework fails here.
          [transforms.ocsf]
          type = "remap"
          inputs = ["demo"]
          source = '''
          ev = parse_suricata_eve(s'{"event_type": "alert", "src_ip": "10.0.0.1"}')
          .class_uid = ocsf_classify(ev)
          .ocsf = ocsf_normalize(ev)
          .entity = caver_entity_id({"hostname": "web01"}, "host")
          .internal = is_internal_ip("10.0.0.1")
          '''

          [sinks.lake]
          type = "caver_parquet"
          inputs = ["ocsf"]
          bucket = "ci-validate"
          endpoint = "http://127.0.0.1:1"
          access_key_env = "CAVER_CI_AK"
          secret_key_env = "CAVER_CI_SK"
          healthcheck.enabled = false
          EOF
          CAVER_CI_AK=ci CAVER_CI_SK=ci ./target/debug/vector validate "$RUNNER_TEMP/caver-component-ci.toml"
      - name: Wrapper sink unit tests
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        # The caver-crates job covers only the caver workspace; the wrapper
        # (src/sinks/caver_parquet) lives in the root vector workspace and was
        # otherwise never tested in CI (caver-collector#899 item 4). Reuses
        # the dependency cache from the build step above.
        run: cargo test --locked --no-default-features --features "sinks-caver_parquet,sinks-console,sources-demo_logs,transforms-remap" --lib sinks::caver_parquet
      - name: Caver VRL adapter tests
        if: steps.check.outputs.skip != 'true' && steps.paths.outputs.skip != 'true'
        # The VRL adapter crate (lib/vector-vrl/caver-stdlib) and the
        # registration tests in vector-vrl-functions also live in the root
        # workspace (caver-collector#904). --no-default-features keeps
        # vector-vrl-functions off its dnstap/vrl-metrics optionals here;
        # the registration itself is unconditional.
        run: cargo test --locked --no-default-features -p vector-vrl-caver-stdlib -p vector-vrl-functions
